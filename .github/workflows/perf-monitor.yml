name: Perf Monitor

on:
  pull_request:
    paths:
      - ".github/workflows/perf-monitor.yml"
      - "docs/developer/quality/baselines/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "packages/**"
      - "scripts/**"
      - "src/**"
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: perf-monitor-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf-pr-report:
    name: Perf Playwright (report only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build for perf
        run: npm run build:e2e
      - name: Check release surface before perf tests
        run: npm run check:release-surface
      - name: Run perf project
        id: perf
        continue-on-error: true
        run: xvfb-run --auto-servernum -- npx playwright test --config=e2e/playwright.config.ts --project=perf
      - name: Summarize PR perf result
        if: always()
        run: |
          echo "## Perf Monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: pull request / report only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifacts: reports, traces, and screenshots are not uploaded. Reproduce locally with synthetic public fixtures for review." >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.perf.outcome }}" = "failure" ]; then
            echo "- Result: report only (soft/hard regression observed)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Action: reproduce locally and review the result before deciding whether to refresh baselines or tighten budgets." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Result: perf project passed in report-only mode." >> "$GITHUB_STEP_SUMMARY"
          fi

  perf-enforced:
    name: Perf Playwright
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build for perf
        run: npm run build:e2e
      - name: Check release surface before perf tests
        run: npm run check:release-surface
      - name: Run perf project
        id: perf
        run: xvfb-run --auto-servernum -- npx playwright test --config=e2e/playwright.config.ts --project=perf
      - name: Summarize enforced perf result
        if: always()
        run: |
          echo "## Perf Monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: nightly/manual / enforced" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.perf.outcome }}" = "failure" ]; then
            echo "- Result: regression detected and job failed." >> "$GITHUB_STEP_SUMMARY"
            echo "- Action: reproduce locally with synthetic public fixtures; review before fixing or deliberately refreshing baselines. No artifacts are uploaded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Result: perf project passed in enforced mode." >> "$GITHUB_STEP_SUMMARY"
          fi
