name: Runtime WASM Browser

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-wasm-browser.yml"
      - "docs/developer/api/spec/runtime-spec-v1.md"
      - "docs/developer/quality/public-api-status.md"
      - "docs/developer/quality/release-policy.md"
      - "package.json"
      - "package-lock.json"
      - "packages/core/**"
      - "packages/runtime/**"
      - "packages/runtime-native/**"
      - "packages/runtime-wasm/**"
      - "packages/editor-host/**"
      - "packages/renderer-pixi/**"
      - "packages/model/src/project-format-v11/**"
      - "packages/model/src/internal/project-format-v11.ts"
      - "packages/model/src/evaluation-payload-v1/**"
      - "packages/model/src/internal/evaluation-payload-v1.ts"
      - "src/lib/project-v11-native-png.ts"
      - "src/lib/__tests__/project-v11-native-png.test.ts"
      - "src/lib/runtime-evaluation-preview.ts"
      - "src/lib/__tests__/runtime-evaluation-preview.test.ts"
      - "src/lib/local-asset-copy.ts"
      - "src/components/RuntimePreviewPanel.tsx"
      - "scripts/check-editor-v11-masks-browser.mjs"
      - "scripts/check-runtime-native-wasm.mjs"
      - "scripts/check-native-artifact-policy.mjs"
      - "scripts/check-runtime-wasm-browser.mjs"
      - "scripts/run-quality-gates.mjs"
      - "scripts/generate-runtime-native-wasm-module.mjs"
      - "tests/conformance/runtime-v1/**"
      - "tests/conformance/project-embedded-round-trip-v11/**"
      - "tsconfig.json"
      - "tsconfig.packages.json"
      - "vite.aliases.ts"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-wasm-browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Runtime WASM Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: xvfb-run --auto-servernum -- npm run test:runtime-wasm:browser -- --headed
      - name: Verify real Editor v11 WebGL mask pixels
        run: node scripts/check-editor-v11-masks-browser.mjs
      - run: npx biome check scripts/check-runtime-wasm-browser.mjs scripts/check-editor-v11-masks-browser.mjs packages/runtime-wasm/src/internal/evaluation-runtime-v1.ts packages/renderer-pixi/src/evaluation-model.ts
