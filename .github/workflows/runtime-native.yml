name: Runtime Native

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-native.yml"
      - "docs/developer/api/spec/runtime-spec-v1.md"
      - "docs/developer/architecture/overview.md"
      - "docs/developer/architecture/package-graph.md"
      - "docs/developer/contributing/package-boundaries.md"
      - "docs/developer/quality/public-api-status.md"
      - "docs/developer/quality/release-policy.md"
      - "package.json"
      - "package-lock.json"
      - "packages/model/src/evaluation-payload-v1.ts"
      - "packages/model/src/evaluation-payload-v1/evaluation-payload-v1.schema.json"
      - "packages/model/src/evaluation-payload-v1/evaluation-texture-plan-v1.schema.json"
      - "packages/model/src/internal/generated/evaluation-v1-validators.mjs"
      - "packages/runtime-native/Cargo.lock"
      - "packages/runtime-c-abi/**"
      - "packages/runtime-native/**"
      - "scripts/check-runtime-c-abi.mjs"
      - "scripts/check-runtime-c-abi-link.mjs"
      - "scripts/check-runtime-c-abi-v02-host-smoke.mjs"
      - "scripts/check-runtime-png.mjs"
      - "scripts/check-runtime-asset-host-local.mjs"
      - "scripts/check-runtime-asset-resolver.mjs"
      - "scripts/check-runtime-asset-store-local.mjs"
      - "scripts/check-runtime-native-evaluation.mjs"
      - "scripts/check-runtime-native-evaluation-lowering.mjs"
      - "scripts/check-runtime-native-evaluation-math.mjs"
      - "scripts/check-runtime-native-preactivation.mjs"
      - "scripts/check-native-artifact-policy.mjs"
      - "scripts/check-runtime-native-wasm.mjs"
      - "scripts/generate-runtime-native-wasm-module.mjs"
      - "scripts/generate-schema-validators.mjs"
      - "scripts/quality-gate-manifest.json"
      - "scripts/run-quality-gates.mjs"
      - "tests/conformance/runtime-v1/basic-mesh.fixture.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  native-check:
    name: Native Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.89.0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.89.0
      - run: rustup target add wasm32-unknown-unknown
      - run: rustup show
      - name: Verify Evaluation Payload foundation on a clean native target
        run: npm run check:runtime-native-evaluation
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-runtime-native-evaluation-native
      - name: Compile Evaluation Payload foundation tests and run Clippy for wasm32
        run: npm run check:evaluation:wasm32 --workspace @vivi2d/runtime-native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-runtime-native-evaluation-wasm32
      - name: Verify private Asset Model resolver on a clean native target
        run: npm run check:runtime-asset-resolver
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-asset-resolver-native
      - name: Compile Asset Model resolver tests and run Clippy for wasm32
        run: npm run check:asset-resolver:wasm32 --workspace @vivi2d/runtime-native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-asset-resolver-wasm32
      - name: Verify principal-bound local Asset store on a clean native target
        run: npm run check:runtime-asset-store-local
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-asset-store-local-native
      - name: Verify private local Asset host on a clean native target
        run: npm run check:runtime-asset-host-local
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-asset-host-local-native
      - name: Verify private native Evaluation preactivation on a clean target
        run: npm run check:runtime-native-preactivation
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-runtime-native-preactivation-native
      - name: Verify private native Evaluation lowering foundation on a clean target
        run: npm run check:runtime-native-evaluation-lowering
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-runtime-native-evaluation-lowering-native
      - name: Verify private consumer-zero deterministic math oracle on a clean native target
        run: npm run check:runtime-native-evaluation-math
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-runtime-native-evaluation-math-native
      - name: Compile the deterministic math oracle tests and run Clippy for wasm32
        run: npm run check:evaluation-math:wasm32 --workspace @vivi2d/runtime-native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-runtime-native-evaluation-math-wasm32
      - run: npm run check:runtime-native
      - run: cargo test --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-core --no-default-features --features render-v02
      - run: cargo clippy --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-core --no-default-features --features render-v02 --all-targets -- -D warnings
      - run: cargo test --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-c-abi --no-default-features --features abi-v02 --all-targets
      - run: cargo clippy --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-c-abi --no-default-features --features abi-v02 --all-targets -- -D warnings
      - run: cargo test --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-c-abi --no-default-features --features png-v1 --all-targets
      - run: cargo clippy --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-c-abi --no-default-features --features png-v1 --all-targets -- -D warnings
      - run: cargo test --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-c-abi --no-default-features --features abi-v02,png-v1 --all-targets
      - run: cargo clippy --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-c-abi --no-default-features --features abi-v02,png-v1 --all-targets -- -D warnings
      - run: cargo check --manifest-path packages/runtime-native/Cargo.toml -p vivi-png-ref --target wasm32-unknown-unknown
      - run: npm run check:runtime-c-abi-link
      - run: npx biome check scripts/check-runtime-asset-host-local.mjs scripts/check-runtime-asset-resolver.mjs scripts/check-runtime-asset-store-local.mjs scripts/check-runtime-c-abi-v02-host-smoke.mjs scripts/check-runtime-c-abi.mjs scripts/check-runtime-native-evaluation-lowering.mjs scripts/check-runtime-native-evaluation-math.mjs scripts/check-runtime-native-evaluation.mjs scripts/check-runtime-native-preactivation.mjs scripts/check-runtime-png.mjs
      - name: Verify ABI 0.1/0.2 exports and host-observation parity subset
        run: npm run check:runtime-c-abi-v02-host-smoke
      - name: Verify strict PNG reference decoder and feature-isolated C ABI
        run: npm run check:runtime-png
      - run: cargo build --manifest-path packages/runtime-native/Cargo.toml --workspace --release
      - run: npm run check:native-artifact-policy
