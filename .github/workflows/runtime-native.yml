name: Runtime Native

on:
  pull_request:
    paths:
      - ".cargo/config"
      - ".cargo/config.toml"
      - ".github/workflows/runtime-native.yml"
      - "docs/developer/api/spec/runtime-spec-v1.md"
      - "docs/developer/architecture/overview.md"
      - "docs/developer/architecture/evaluation-c10-integration.md"
      - "docs/developer/architecture/package-graph.md"
      - "docs/developer/contributing/package-boundaries.md"
      - "docs/developer/quality/public-api-status.md"
      - "docs/developer/quality/release-policy.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "biome.json"
      - "electron-builder.yml"
      - "electron/native-local-asset.cjs"
      - "electron/native-local-asset/**"
      - "electron/__tests__/native-local-asset-loader.test.ts"
      - "scripts/build-local-asset-addon.mjs"
      - "scripts/check-local-asset-addon.mjs"
      - "scripts/check-local-asset-after-pack.cjs"
      - "scripts/lib/local-asset-package.mjs"
      - "scripts/lib/local-asset-native-notices.mjs"
      - "scripts/local-asset-native-notices.node-test.mjs"
      - "scripts/fixtures/local-asset-native-notices-v1.json"
      - "scripts/fixtures/local-asset-addon-electron.cjs"
      - "scripts/fixtures/local-asset-addon-regressions.cjs"
      - "scripts/fixtures/local-asset-manifest-seed.rs"
      - "scripts/fixtures/local-asset-ports-electron.cjs"
      - "electron/local-asset-copy.ts"
      - "electron/local-asset-copy-contract.cjs"
      - "electron/ipc/local-asset-copy.cjs"
      - "electron/ipc-contract.cjs"
      - "electron/security.cjs"
      - "electron/preload.cjs"
      - "electron/main.cjs"
      - "electron/__tests__/local-asset-copy-*.test.ts"
      - "packages/runtime-wasm/**"
      - "packages/renderer-pixi/**"
      - "packages/editor-host/**"
      - "packages/model/src/project-format-v11/**"
      - "packages/model/src/internal/project-format-v11.ts"
      - "packages/model/src/internal/evaluation-payload-v1.ts"
      - "packages/model/src/evaluation-payload-v1/**"
      - "src/components/RuntimePreviewPanel.tsx"
      - "src/components/LocalExchangePanel.tsx"
      - "src/components/LocalAssetCopyPanel.tsx"
      - "src/lib/runtime-evaluation-preview.ts"
      - "src/lib/local-asset-copy.ts"
      - "src/lib/electron.d.ts"
      - "src/lib/__tests__/runtime-evaluation-preview.test.ts"
      - "src/components/__tests__/RuntimePreviewPanel.test.tsx"
      - "scripts/check-runtime-preview-electron.mjs"
      - "scripts/fixtures/runtime-preview-electron.cjs"
      - "scripts/fixtures/runtime-preview-page.tsx"
      - "vite.aliases.ts"
      - "vite.config.ts"
      - "electron/local-exchange-host.ts"
      - "electron/ipc/local-exchange.cjs"
      - "electron/tsconfig.local-exchange.json"
      - "scripts/build-local-exchange-host.mjs"
      - "packages/model/src/evaluation-payload-v1.ts"
      - "packages/model/src/evaluation-payload-v1/evaluation-payload-v1.schema.json"
      - "packages/model/src/evaluation-payload-v1/evaluation-texture-plan-v1.schema.json"
      - "packages/model/src/internal/generated/evaluation-v1-validators.mjs"
      - "packages/runtime-native/Cargo.lock"
      - "packages/runtime-c-abi/**"
      - "packages/runtime-native/**"
      - "scripts/check-runtime-c-abi.mjs"
      - "scripts/check-runtime-c-abi-link.mjs"
      - "scripts/lib/runtime-c-abi-compiler.mjs"
      - "scripts/check-runtime-c-abi-v02-host-smoke.mjs"
      - "scripts/check-runtime-png.mjs"
      - "scripts/lib/runtime-png-tools.mjs"
      - "scripts/lib/runtime-png-tools.test.mjs"
      - "scripts/check-runtime-asset-host-local.mjs"
      - "scripts/check-runtime-asset-resolver.mjs"
      - "scripts/check-runtime-asset-store-local.mjs"
      - "scripts/check-runtime-native-evaluation.mjs"
      - "scripts/check-runtime-native-evaluation-lowering.mjs"
      - "scripts/lib/evaluation-lowering-c10-corpus.mjs"
      - "scripts/lib/evaluation-lowering-c10-corpus.node-test.mjs"
      - "scripts/lib/evaluation-lowering-c10-execution.mjs"
      - "scripts/lib/evaluation-lowering-c10-wasm-worker.mjs"
      - "scripts/check-runtime-native-evaluation-math.mjs"
      - "scripts/lib/evaluation-math-corpus.mjs"
      - "scripts/lib/evaluation-math-corpus.node-test.mjs"
      - "scripts/lib/evaluation-math-wasm-worker.mjs"
      - "scripts/check-runtime-native-preactivation.mjs"
      - "scripts/check-native-artifact-policy.mjs"
      - "scripts/check-runtime-native-wasm.mjs"
      - "scripts/lib/runtime-native-evaluation-wasm.mjs"
      - "scripts/lib/runtime-native-png-wasm-fixture.mjs"
      - "scripts/generate-runtime-native-wasm-module.mjs"
      - "scripts/generate-schema-validators.mjs"
      - "scripts/quality-gate-manifest.json"
      - "scripts/run-quality-gates.mjs"
      - "tests/conformance/runtime-v1/**"
      - "tests/conformance/project-embedded-round-trip-v11/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  native-check:
    name: Native Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.89.0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify PNG gate process boundaries
        run: npx vitest run scripts/lib/runtime-png-tools.test.mjs
      - run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.89.0
      - run: rustup target add wasm32-unknown-unknown
      - run: rustup show
      - name: Verify Evaluation Payload foundation on a clean native target
        run: npm run check:runtime-native-evaluation
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-runtime-native-evaluation-native
      - name: Compile Evaluation Payload foundation tests and run Clippy for wasm32
        run: npm run check:evaluation:wasm32 --workspace @vivi2d/runtime-native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-runtime-native-evaluation-wasm32
      - name: Verify private Asset Model resolver on a clean native target
        run: npm run check:runtime-asset-resolver
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-asset-resolver-native
      - name: Compile Asset Model resolver tests and run Clippy for wasm32
        run: npm run check:asset-resolver:wasm32 --workspace @vivi2d/runtime-native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-asset-resolver-wasm32
      - name: Verify principal-bound local Asset store on a clean native target
        run: npm run check:runtime-asset-store-local
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-asset-store-local-native
      - name: Verify private local Asset host on a clean native target
        run: npm run check:runtime-asset-host-local
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-asset-host-local-native
      - name: Verify private native Evaluation preactivation on a clean target
        run: npm run check:runtime-native-preactivation
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-runtime-native-preactivation-native
      - name: Verify Evaluation lowering and fixed C10 native/test-WASM execution
        run: npm run check:runtime-native-evaluation-lowering
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-runtime-native-evaluation-lowering-native
      - name: Verify Evaluation owner activation and stale-request rejection
        run: npm run check:evaluation-owner --workspace @vivi2d/runtime-native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-runtime-native-evaluation-owner-native
      - name: Verify pure byte preparation, Evaluation ABI, allocator guard and compile-fail ownership
        run: npm run check:evaluation-bridge --workspace @vivi2d/runtime-native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-runtime-native-evaluation-bridge
      - name: Verify actual Evaluation C header, linkage and copy-out
        run: node scripts/check-runtime-c-abi-link.mjs --evaluation-v1
      - name: Verify the internal deterministic math kernel on a clean native target
        run: npm run check:runtime-native-evaluation-math
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-runtime-native-evaluation-math-native
      - name: Compile the deterministic math oracle tests and run Clippy for wasm32
        run: npm run check:evaluation-math:wasm32 --workspace @vivi2d/runtime-native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/vivi-runtime-native-evaluation-math-wasm32
      - name: Execute the deterministic math primitive corpus in test-only WASM
        run: npm run check:evaluation-math-wasm-execution
      - run: npm run check:runtime-native
      - run: cargo test --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-core --no-default-features --features render-v02
      - run: cargo clippy --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-core --no-default-features --features render-v02 --all-targets -- -D warnings
      - run: cargo test --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-c-abi --no-default-features --features abi-v02 --all-targets
      - run: cargo clippy --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-c-abi --no-default-features --features abi-v02 --all-targets -- -D warnings
      - run: cargo test --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-c-abi --no-default-features --features png-v1 --all-targets
      - run: cargo clippy --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-c-abi --no-default-features --features png-v1 --all-targets -- -D warnings
      - run: cargo test --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-c-abi --no-default-features --features abi-v02,png-v1 --all-targets
      - run: cargo clippy --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-c-abi --no-default-features --features abi-v02,png-v1 --all-targets -- -D warnings
      - run: cargo check --manifest-path packages/runtime-native/Cargo.toml -p vivi-png-ref --target wasm32-unknown-unknown
      - name: Verify C ABI link smoke (Unix)
        if: runner.os != 'Windows'
        run: npm run check:runtime-c-abi-link
      - name: Verify C ABI linkage, ABI 0.1/0.2 host smoke, and PNG ABI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe was not found"
          }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsPath) {
            throw "Visual Studio installation path was not found"
          }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (!(Test-Path $vcvars)) {
            throw "vcvars64.bat was not found"
          }
          cmd /c "`"$vcvars`" && npm run check:runtime-c-abi-link && npm run check:runtime-c-abi-v02-host-smoke && npm run check:runtime-png"
          if ($LASTEXITCODE -ne 0) {
            throw "MSVC C ABI and PNG checks failed with exit code $LASTEXITCODE"
          }
      - run: npx biome check scripts/check-runtime-asset-host-local.mjs scripts/check-runtime-asset-resolver.mjs scripts/check-runtime-asset-store-local.mjs scripts/check-runtime-c-abi-v02-host-smoke.mjs scripts/check-runtime-c-abi.mjs scripts/check-runtime-native-evaluation-lowering.mjs scripts/check-runtime-native-evaluation-math.mjs scripts/check-runtime-native-evaluation.mjs scripts/check-runtime-native-preactivation.mjs scripts/check-runtime-png.mjs scripts/lib/evaluation-math-corpus.mjs scripts/lib/evaluation-math-corpus.node-test.mjs scripts/lib/evaluation-math-wasm-worker.mjs scripts/lib/evaluation-lowering-c10-corpus.mjs scripts/lib/evaluation-lowering-c10-corpus.node-test.mjs scripts/lib/evaluation-lowering-c10-execution.mjs scripts/lib/evaluation-lowering-c10-wasm-worker.mjs
      - name: Verify ABI 0.1/0.2 exports and host-observation parity subset
        if: runner.os != 'Windows'
        run: npm run check:runtime-c-abi-v02-host-smoke
      - name: Verify strict PNG reference decoder and feature-isolated C ABI
        if: runner.os != 'Windows'
        run: npm run check:runtime-png
      - run: cargo build --manifest-path packages/runtime-native/Cargo.toml --workspace --release
      - run: npm run check:native-artifact-policy

  local-asset-addon-check:
    name: Local Asset Addon (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare pinned Electron runtime and notices
        run: node node_modules/electron/install.js
      - run: rustup toolchain install 1.89.0 --profile minimal --component clippy
      - run: rustup toolchain install 1.94.1 --profile minimal --component clippy
      - name: Verify isolated local Asset C ABI at the minimum Rust version
        run: cargo +1.89.0 test --locked --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-c-abi --no-default-features --features local-asset-host-v1 --all-targets
      - run: cargo +1.89.0 clippy --locked --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-c-abi --no-default-features --features local-asset-host-v1 --all-targets -- -D warnings
      - name: Verify isolated local Asset C ABI at the shipping Rust version
        run: cargo +1.94.1 test --locked --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-c-abi --no-default-features --features local-asset-host-v1 --all-targets
      - run: cargo +1.94.1 clippy --locked --manifest-path packages/runtime-native/Cargo.toml -p vivi-runtime-native-c-abi --no-default-features --features local-asset-host-v1 --all-targets -- -D warnings
      - name: Build the pinned addon and verify it in actual Electron
        run: npm run check:local-asset-addon
      - name: Check fixed native notice and package guards
        run: npx biome check scripts/build-local-asset-addon.mjs scripts/check-local-asset-addon.mjs scripts/check-local-asset-after-pack.cjs scripts/lib/local-asset-native-notices.mjs scripts/lib/local-asset-package.mjs scripts/local-asset-native-notices.node-test.mjs
      - name: Build the actual main and Editor preview consumer
        run: npm run build:e2e
      - name: Verify native capture through actual Electron, EDH, WASM and WebGL
        run: npm run check:runtime-preview-electron
      - run: npx biome check scripts/check-runtime-preview-electron.mjs scripts/fixtures/runtime-preview-electron.cjs scripts/fixtures/runtime-preview-page.tsx src/components/RuntimePreviewPanel.tsx src/lib/runtime-evaluation-preview.ts
