appId: com.vivi2d.editor
productName: Vivi2D
asar: false
publish: null
afterPack: scripts/check-local-asset-after-pack.cjs
artifactName: "vivi2d-${env.VERSION}-windows-x64-setup.${ext}"
directories:
  output: dist/windows-installer
files:
  - from: dist
    to: dist
    filter:
      - "**/*"
      - "!**/*.map"
      - "!windows-installer/**"
  - from: electron
    to: electron
    filter:
      - "**/*.cjs"
      - "generated/native-local-asset/win32-x64/vivi_local_asset_v1.node"
      - "generated/native-local-asset/win32-x64/manifest.json"
      - "generated/native-local-asset/win32-x64/NATIVE_LOCAL_ASSET_NOTICES.txt"
      - "generated/native-local-asset/win32-x64/native-local-asset.cdx.json"
      - "generated/native-local-asset/win32-x64/vcruntime140.dll"
  - package.json
  - LICENSE
  - "!node_modules/**"
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.ts"
  - "!node_modules/**/src/**"
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/__tests__/**"
  - "!node_modules/**/__mocks__/**"
  - "!node_modules/**/coverage/**"
  - "!node_modules/**/docs/**"
  - "!node_modules/**/doc/**"
  - "!node_modules/**/example/**"
  - "!node_modules/**/examples/**"
extraFiles:
  - from: THIRD_PARTY_NOTICES
    to: resources/app/THIRD_PARTY_NOTICES.txt
extraMetadata:
  main: electron/main.cjs
win:
  target:
    - target: nsis
      arch:
        - x64
  forceCodeSigning: false
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vivi2D
