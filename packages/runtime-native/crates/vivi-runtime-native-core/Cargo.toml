[package]
name = "vivi-runtime-native-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "vivi_runtime_native_core"
path = "src/lib.rs"

[features]
default = []
render-v02 = []
evaluation-v1 = ["dep:vivi-runtime-native-evaluation-lowering"]

[dependencies]
serde_json = "1.0"
vivi-runtime-native-evaluation-lowering = { path = "../vivi-runtime-native-evaluation-lowering", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"
vivi-runtime-native-evaluation-lowering = { path = "../vivi-runtime-native-evaluation-lowering", default-features = false, features = ["native-host"] }
vivi-runtime-native-preactivation = { path = "../vivi-runtime-native-preactivation", default-features = false, features = ["native-host"] }
