[package]
name = "vivi-asset-store-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "vivi_asset_store_local"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits"] }
sha2 = { version = "0.10", default-features = false }
vivi-asset-resolver = { path = "../vivi-asset-resolver", default-features = false }

[dev-dependencies]
base64 = "0.23"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
