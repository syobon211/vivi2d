[package]
name = "vivi-runtime-native-preactivation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "vivi_runtime_native_preactivation"
path = "src/lib.rs"

[features]
default = ["native-host"]
native-host = ["vivi-asset-host-local/local-store"]

[dependencies]
vivi-asset-host-local = { path = "../vivi-asset-host-local", default-features = false }
vivi-runtime-native-evaluation = { path = "../vivi-runtime-native-evaluation", default-features = false }

[dev-dependencies]
base64 = "0.22"
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tempfile = "3"
